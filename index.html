<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ListenLoop</title>
  <meta name="description" content="英文聽力 × 單句循環 × 中英字幕">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ListenLoop">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- Route views render here -->
    <main id="view" tabindex="-1"></main>

    <!-- The one and only YouTube player. It is never moved in the DOM (moving an
         iframe reloads it); routes only change its CSS state. -->
    <section id="playerDock" aria-label="Video player" hidden>
      <div class="dock-frame"><div id="ytHost"></div>
        <!-- Demo picture: muted, follows #audioEl (js/player/video-follower.js). -->
        <video id="videoEl" class="dock-video" muted playsinline webkit-playsinline preload="none" disablepictureinpicture disableremoteplayback aria-hidden="true"></video>
        <div id="audioPanel" class="audio-panel" hidden></div></div>
    </section>

    <!-- Own audio (public-domain demo media): the only sound source for demos, so it keeps
         playing in the background / on the lock screen. -->
    <audio id="audioEl" preload="metadata" playsinline></audio>

    <!-- Shown outside the player route while a video is loaded (player paused). -->
    <button id="miniBar" class="mini-bar" hidden type="button"></button>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
